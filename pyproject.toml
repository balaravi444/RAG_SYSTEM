[project]
name = "rag-system"
version = "1.0.0"
description = "A production-ready Retrieval-Augmented Generation system with Groq LLM, ChromaDB vector store, FastAPI, and CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # Core LangChain
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "langchain-core>=0.3.0",
    "langchain-chroma>=0.2.0",
    "langchain-text-splitters>=0.3.0",

    # Vector store
    "chromadb>=0.5.0",

    # Embeddings
    "sentence-transformers>=3.0.0",

    # Document loaders
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "beautifulsoup4>=4.12.0",
    # API server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # CLI
    "click>=8.1.0",
    "rich>=13.0.0",

    # Config & utilities
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
rag = "rag_system.cli:cli"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_system*"]
